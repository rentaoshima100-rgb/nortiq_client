    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
        color: #0f172a; line-height: 1.7;
      }
      .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
      header { border-bottom: 1px solid #e2e8f0; }
      header .wrap { display: flex; align-items: center; height: 76px; }
      .logo { font-size: 22px; font-weight: 800; }
      nav { margin-left: auto; font-size: 14px; }
      nav a { color: #0f172a; text-decoration: none; }
      h1 { font-size: 32px; font-weight: 800; margin: 48px 0 32px; }
      .works { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding-bottom: 64px; }
      .work img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; background: #e2e8f0; }
      .work .t { margin-top: 10px; font-weight: 700; }
      .work .m { font-size: 13px; color: #94a3b8; }
      @media (max-width: 800px) { .works { grid-template-columns: 1fr; } }
    </style>
